[Unit]
RequiresMountsFor=
RequiresMountsFor=/faster/qram-snapshots

[Service]
Environment=QDRANT__STORAGE__SNAPSHOTS_PATH=/faster/qram-snapshots
Environment=QRAM_SNAPSHOTS=/faster/qram-snapshots
ExecStartPost=/usr/bin/timeout 870 /bin/sh -c 'until /usr/bin/curl --fail --silent --max-time 5 http://127.0.0.1:6335/readyz >/dev/null; do sleep 2; done'
