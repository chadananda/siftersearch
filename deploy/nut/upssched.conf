# /etc/nut/upssched.conf — Chad 10-23: the battery is for an EMERGENCY. On battery 10 s → READ-ONLY + flush everything held
# in RAM (a flicker does nothing); back on mains and stable 60 s → resume. NO shutdown here: upsmon shuts down by itself only
# on LOW BATTERY (ups.conf: runtime ≤ 180 s or charge ≤ 10 %) via SHUTDOWNCMD. Runbook: planning/db-write-path-20261023.md.
CMDSCRIPT /usr/local/bin/upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

AT ONBATT  * START-TIMER readonly 10
AT ONBATT  * CANCEL-TIMER resume
AT ONBATT  * EXECUTE onbatt
AT ONLINE  * CANCEL-TIMER readonly
AT ONLINE  * START-TIMER resume 60
AT ONLINE  * EXECUTE online
AT LOWBATT * EXECUTE lowbatt
AT COMMBAD * START-TIMER commbad 300
AT COMMOK  * CANCEL-TIMER commbad
AT NOCOMM  * EXECUTE commbad
AT REPLBATT * EXECUTE replbatt
