# /etc/nut/ups.conf — try in order (test procedure: planning/storage-wear-ram-plan.md §1.1):
#   1. usbhid-ups (HID Power Device class — CyberPower CP1500PFCLCD, most "PC-link" units)
#   2. nutdrv_qx (Megatec/Q1-style serial-over-USB: many Chinese OEM units; set `subdriver` from nut-scanner if it names one)
#   3. blazer_usb (older Megatec driver, if nutdrv_qx cannot talk to it)
# Replace vendorid/productid with the values from `lsusb` / `nut-scanner -U`.
maxretry = 3

[tower]
    driver = usbhid-ups
    port = auto
    # vendorid = XXXX
    # productid = XXXX
    desc = "GoldenMate 1500VA/1000W LiFePO4 (or CyberPower CP1500PFCLCD)"
    pollinterval = 5
    # LOW BATTERY = runtime ≤ 3 min OR charge ≤ 10 % (Chad 10-23: shut down only when the battery is VERY low). ignorelb makes
    # the driver raise LB from these thresholds instead of the UPS's own flag (LiFePO4 holds voltage flat until near empty).
    # If the driver exposes no battery.runtime, only the charge threshold applies — check `upsc tower` at install.
    ignorelb
    override.battery.charge.low = 10
    override.battery.runtime.low = 180
