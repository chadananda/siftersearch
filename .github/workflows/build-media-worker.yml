name: Build media worker image

on:
  push:
    branches: [main]
    paths: ['docker/media-worker/**', 'scripts/media/runpod_worker.py', 'scripts/media/remaster_guard.py', 'scripts/media/media_tool.py', 'scripts/media/worker/**', 'api/lib/media/cloud.js']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag'
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/chadananda/sifter-media-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk (the image with weights is ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Build context (code + the pinned weights list)
        run: |
          mkdir -p ctx/media/worker
          cp docker/media-worker/* ctx/
          cp scripts/media/runpod_worker.py scripts/media/remaster_guard.py scripts/media/media_tool.py ctx/media/
          cp scripts/media/worker/*.py ctx/media/worker/
          # one source of truth for the pins: cloud.js WEIGHTS -> weights.tsv
          node -e "import('./api/lib/media/cloud.js').then(c => console.log(c.WEIGHTS.map(w => w.join('\t')).join('\n')))" > ctx/weights.tsv
          node -e "import('./api/lib/media/cloud.js').then(c => console.log(c.CLEANUP_WEIGHTS.map(w => w.join('\t')).join('\n')))" > ctx/weights-cleanup.tsv
          wc -l ctx/weights.tsv ctx/weights-cleanup.tsv

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: tags
        run: |
          V=$(date -u +%Y%m%d)-${GITHUB_SHA::8}
          T="${IMAGE}:${V},${IMAGE}:latest"
          [ -n "${{ inputs.tag }}" ] && T="$T,${IMAGE}:${{ inputs.tag }}"
          echo "list=$T" >> $GITHUB_OUTPUT; echo "version=$V" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v5
        with:
          context: ctx
          file: ctx/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Report
        run: echo "pushed ${IMAGE}:${{ steps.tags.outputs.version }}" >> $GITHUB_STEP_SUMMARY
